<!DOCTYPE html>
<html>
<head>
    <title>Toggle Example</title>
</head>

<body>

 <h1 id="text">NIDHI</h1>
 <button onClick="toggleText()">CLcujhvujvjhICK ME</button>
 <script>
  function toggleText(){
    let x = document.getElementById("text");
    if(x.innerHTML==="NIDHI"){
      x.innerHTML="ANISH";
    }
    else{
      x.innerHTML="NIDHI";
    }
  }
 </script>

</body>
</html>
